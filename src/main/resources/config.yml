  COAL: 1
  COPPER_INGOT: 1
  RAW_COPPER: 1
  LAPIS_LAZULI: 1
  REDSTONE: 1
  RAW_IRON: 3
  IRON_INGOT: 4
  RAW_GOLD: 5
  GOLD_INGOT: 6
  QUARTZ: 3
  AMETHYST_SHARD: 4
  EMERALD: 30
  DIAMOND: 40
  NETHERITE_SCRAP: 60
  ANCIENT_DEBRIS: 100
  NETHERITE_INGOT: 250
