# El lobby se construye solo (mundo runrpg_lobby). /setlobby es opcional.
shard:
  charge-seconds: 5    # segundos sosteniendo el Eco Shard para cargarlo

shop:
  health: { base-cost: 100, cost-step: 75,  max-level: 10 }   # +1 corazon por nivel
  slots:  { base-cost: 150, cost-step: 40,  max-level: 33 }   # slots de inventario extra
  food:   { base-cost: 200, cost-step: 400, max-level: 3 }    # comida inicial

